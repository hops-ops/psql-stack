name: Backup recovery contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.15'
    - uses: upbound/action-up@v1.2.0
      with:
        skip-login: true
    - uses: azure/setup-helm@v5
      with:
        version: v4.3.1
    - uses: helm/kind-action@v1.15.2
      with:
        install_only: true
        version: v0.33.0
    - name: Install test dependencies
      run: python3 -m pip install 'PyYAML==6.0.3' 'boto3==1.40.10'
    - name: Render and reject conflicting policies
      run: make backup-test
    - name: Seeded latest and point-in-time recovery
      run: make backup-e2e
    - name: Preserve recovery evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backup-recovery-evidence
        path: _output/backup-evidence/
