apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: psqlstacks.hops.ops.com.ai
spec:
  group: hops.ops.com.ai
  names:
    kind: PSQLStack
    plural: psqlstacks
  scope: Namespaced
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: PSQLStack deploys CloudNativePG, the cnpg-i-scale-to-zero plugin, and the Atlas Operator. It's the platform layer — per-app serving clusters live in PSQLCluster; ephemeral forks live in PSQLBranch.
        type: object
        properties:
          spec:
            description: PSQLStackSpec defines the desired state.
            type: object
            properties:
              clusterName:
                description: Name of the target cluster. Used as default for helmProviderConfigRef.name and resource naming.
                type: string
              managementPolicies:
                description: Management policies for all composed resources. Defaults to ["*"].
                type: array
                items:
                  type: string
                default:
                - "*"
              labels:
                description: Custom labels applied to all managed resources.
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              helmProviderConfigRef:
                description: Reference to the Helm ProviderConfig. Defaults to clusterName.
                type: object
                properties:
                  name:
                    description: Name of the Helm ProviderConfig.
                    type: string
                  kind:
                    description: Kind of the ProviderConfig. Defaults to ProviderConfig.
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              kubernetesProviderConfigRef:
                description: Reference to the Kubernetes ProviderConfig (used to create the Karpenter NodePool Object and to apply the scale-to-zero plugin manifest). Defaults to clusterName.
                type: object
                properties:
                  name:
                    description: Name of the Kubernetes ProviderConfig.
                    type: string
                  kind:
                    description: Kind of the ProviderConfig. Defaults to ProviderConfig.
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              namespace:
                description: Shared namespace for CNPG operator, scale-to-zero plugin, and Atlas operator. Defaults to cnpg-system. Per-component namespace overrides this.
                type: string
              storage:
                description: "Three-profile storage layer. mayastor = replicated NVMe-oF (CoW + HA), lvm = single-node LVM thin clones (CoW, cheap), ebs = EBS gp3 (durable, no CoW). Each profile is independently toggleable. Mayastor + LVM require node-side prerequisites (hugepages, nvme-tcp module, NVMe instance-store devices, LVM volume groups) — these are provided by the NodePool config in phase 3 of the pivot. Until phase 3 lands, leave mayastor.enabled and lvm.enabled at false on clusters that don't already have those prereqs."
                type: object
                properties:
                  mayastor:
                    description: OpenEBS Mayastor (Replicated NVMe-oF) — enterprise default for primary serving clusters. Provides CoW snapshots + HA replication across NVMe nodes.
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: false
                      chartVersion:
                        description: Mayastor Helm chart version. Defaults to 2.10.0.
                        type: string
                      namespace:
                        description: Namespace override for the Mayastor install. Defaults to mayastor.
                        type: string
                      storageClassName:
                        description: StorageClass name. Defaults to psql-mayastor.
                        type: string
                      replicationFactor:
                        description: Number of replicas per volume. Defaults to 3 (quorum-safe HA).
                        type: integer
                        default: 3
                      thin:
                        description: Thin-provision volumes (CoW). Defaults to true.
                        type: boolean
                        default: true
                      reclaimPolicy:
                        type: string
                        enum: [Delete, Retain]
                        default: Delete
                      volumeBindingMode:
                        type: string
                        enum: [Immediate, WaitForFirstConsumer]
                        default: WaitForFirstConsumer
                      allowVolumeExpansion:
                        type: boolean
                        default: true
                      values:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      overrideAllValues:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                  lvm:
                    description: OpenEBS LVM LocalPV — single-node CoW via LVM thin volumes. Cheaper than Mayastor; appropriate for branches and dev clusters.
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: false
                      chartVersion:
                        description: lvm-localpv Helm chart version. Defaults to 1.7.0.
                        type: string
                      namespace:
                        description: Namespace override. Defaults to openebs.
                        type: string
                      storageClassName:
                        description: StorageClass name. Defaults to psql-lvm.
                        type: string
                      volumeGroup:
                        description: LVM Volume Group name configured on each NVMe node. Defaults to psql-vg.
                        type: string
                      reclaimPolicy:
                        type: string
                        enum: [Delete, Retain]
                        default: Delete
                      volumeBindingMode:
                        type: string
                        enum: [Immediate, WaitForFirstConsumer]
                        default: WaitForFirstConsumer
                      allowVolumeExpansion:
                        type: boolean
                        default: true
                      values:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      overrideAllValues:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                  ebs:
                    description: EBS gp3 via the EKS Auto Mode CSI driver. Durable but no CoW; pg_basebackup-only branching. Always-on fallback profile.
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                      storageClassName:
                        description: StorageClass name. Defaults to psql-ebs.
                        type: string
                      provisioner:
                        description: CSI provisioner. Defaults to ebs.csi.eks.amazonaws.com (EKS Auto Mode).
                        type: string
                      parameters:
                        description: Provisioner parameters. Defaults to gp3 + ext4.
                        type: object
                        additionalProperties:
                          type: string
                        x-kubernetes-preserve-unknown-fields: true
                      reclaimPolicy:
                        type: string
                        enum: [Delete, Retain]
                        default: Delete
                      volumeBindingMode:
                        type: string
                        enum: [Immediate, WaitForFirstConsumer]
                        default: WaitForFirstConsumer
                      allowVolumeExpansion:
                        type: boolean
                        default: true
              nodePool:
                description: "Dedicated Karpenter NodePools for PostgreSQL workloads. Two sub-pools — `branches` (spot arm64 NVMe, for ephemeral PSQLBranch workloads) and `primary` (on-demand arm64 NVMe, for replicated-cow PSQLCluster primaries where spot preemption would lose a Mayastor replica). Defaults to disabled — node-side prep for Mayastor/LVM (hugepages, nvme-tcp, LVM volume groups) is a separate concern handled in phase 3b. CNPG / scale-to-zero / Atlas schedule on the primary pool when enabled."
                type: object
                properties:
                  enabled:
                    description: Master toggle. When false, neither sub-pool is created. When true, each sub-pool's `enabled` controls individual creation.
                    type: boolean
                    default: false
                  nodeClassName:
                    description: EKS NodeClass shared by both sub-pools. Defaults to "default".
                    type: string
                  disruption:
                    description: Karpenter disruption policy applied to both sub-pools.
                    type: object
                    properties:
                      consolidationPolicy:
                        type: string
                        enum: [WhenEmpty, WhenEmptyOrUnderutilized]
                        default: WhenEmptyOrUnderutilized
                      consolidateAfter:
                        type: string
                        default: "60s"
                  branches:
                    description: Spot arm64 NVMe sub-pool for branches and dev workloads. Cost-optimized; spot preemption is acceptable because branches are ephemeral.
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                      limits:
                        type: object
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                      requirements:
                        description: Karpenter scheduling requirements. Defaults to arm64 spot on i4g.2xlarge / i4g.4xlarge / im4gn.2xlarge (NVMe instance-store, Graviton).
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            operator:
                              type: string
                              enum: [In, NotIn, Exists, DoesNotExist, Gt, Lt]
                            values:
                              type: array
                              items:
                                type: string
                          required: [key, operator]
                  primary:
                    description: On-demand arm64 NVMe sub-pool for replicated-cow PSQLCluster primaries. Spot preemption would lose a Mayastor replica, so on-demand is the right default for serving workloads.
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                      limits:
                        type: object
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                      requirements:
                        description: Karpenter scheduling requirements. Defaults to arm64 on-demand on i4g.2xlarge / i4g.4xlarge / im4gn.2xlarge (NVMe instance-store, Graviton).
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                            operator:
                              type: string
                              enum: [In, NotIn, Exists, DoesNotExist, Gt, Lt]
                            values:
                              type: array
                              items:
                                type: string
                          required: [key, operator]
              cnpg:
                description: Configuration for the CloudNativePG operator Helm release.
                type: object
                properties:
                  name:
                    description: Helm release name. Defaults to cloudnative-pg.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  chartVersion:
                    description: CNPG Helm chart version. Defaults to 0.27.1 (tracks CNPG 1.29.x).
                    type: string
                  values:
                    description: Helm values merged with chart defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              scaleToZeroPlugin:
                description: "Configuration for the cnpg-i-scale-to-zero plugin (github.com/xataio/cnpg-i-scale-to-zero). Installed via upstream release manifest. Zero cost when no PSQLCluster opts into scale-to-zero."
                type: object
                properties:
                  enabled:
                    description: Default true — the plugin is zero-cost when unused and per-cluster opt-in is cheap.
                    type: boolean
                    default: true
                  version:
                    description: Plugin release tag. The manifest URL pins to this. Defaults to v0.1.7.
                    type: string
                  namespace:
                    description: Namespace override for the plugin install. Defaults to cnpg-system (plugin manifest creates the namespace if missing).
                    type: string
              atlasOperator:
                description: Configuration for the Atlas Operator component (declarative database schema migrations).
                type: object
                properties:
                  name:
                    description: Release name. Defaults to atlas-operator.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  values:
                    description: Helm values merged with chart defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
            required:
            - clusterName
          status:
            description: PSQLStackStatus defines the observed state.
            type: object
            properties:
              ready:
                description: Overall readiness of the stack (CNPG + scale-to-zero plugin + Atlas).
                type: boolean
        required:
        - spec
