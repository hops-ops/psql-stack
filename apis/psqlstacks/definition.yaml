apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: psqlstacks.hops.ops.com.ai
spec:
  group: hops.ops.com.ai
  names:
    kind: PSQLStack
    plural: psqlstacks
  scope: Namespaced
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: |
          PSQLStack is the platform layer for Postgres-on-Kubernetes. It composes
          CloudNativePG (the operator), the cnpg-i-scale-to-zero plugin, the Atlas
          Operator (declarative schema migrations), and a VolumeSnapshotClass that
          PSQLBranch uses as a stable target for forking primaries.

          The stack is intentionally OS-agnostic and storage-agnostic — it relies
          on whatever CSI driver and StorageClass the target cluster already
          provides (e.g., gp3 on EKS Auto Mode, standard on kind/k3d). Per-app
          serving clusters live in PSQLCluster; ephemeral forks in PSQLBranch.
        type: object
        properties:
          spec:
            description: PSQLStackSpec defines the desired state.
            type: object
            properties:
              clusterName:
                description: Name of the target cluster. Used as the default for helmProviderConfigRef.name, kubernetesProviderConfigRef.name, and label values.
                type: string
              namespace:
                description: Shared namespace for the CNPG operator, scale-to-zero plugin, and Atlas operator. Per-component namespace overrides take precedence. Defaults to cnpg-system.
                type: string
              labels:
                description: Custom labels merged with the stack's default labels and applied to every composed resource.
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              managementPolicies:
                description: Crossplane managementPolicies applied to every composed resource. Defaults to ["*"].
                type: array
                items:
                  type: string
                default:
                - "*"
              helmProviderConfigRef:
                description: Reference to the Helm ProviderConfig used for CNPG and Atlas releases. Defaults to clusterName.
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              kubernetesProviderConfigRef:
                description: Reference to the Kubernetes ProviderConfig used for the scale-to-zero plugin manifests and the VolumeSnapshotClass. Defaults to clusterName.
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              ha:
                description: |
                  Stack-wide HA mode. When enabled, sets replicaCount + topology spread
                  by zone on every HA-able platform component (CNPG operator, Atlas
                  operator, scale-to-zero plugin Deployment). Per-component values
                  blocks can still override.
                type: object
                properties:
                  enabled:
                    type: boolean
                    default: false
                  replicas:
                    type: integer
                    default: 3
                  topologySpreadByZone:
                    type: boolean
                    default: true
              cnpg:
                description: CloudNativePG operator Helm release configuration.
                type: object
                properties:
                  name:
                    description: Helm release name. Defaults to cloudnative-pg.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  chartVersion:
                    description: CNPG Helm chart version. Defaults to 0.27.1 (tracks CNPG 1.29.x).
                    type: string
                  values:
                    description: Helm values merged with the stack's chart defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              scaleToZeroPlugin:
                description: |
                  cnpg-i-scale-to-zero plugin (github.com/xataio/cnpg-i-scale-to-zero).
                  Installed via the upstream release manifest. Zero cost when no
                  PSQLCluster opts into scale-to-zero. Requires cert-manager on the
                  target cluster (provided by aws-cert-stack).
                type: object
                properties:
                  enabled:
                    type: boolean
                    default: true
                  version:
                    description: Plugin release tag. Defaults to v0.1.7.
                    type: string
                  namespace:
                    description: Namespace override. Defaults to the shared namespace.
                    type: string
              atlasOperator:
                description: Atlas Operator Helm release configuration. Manages declarative database schema migrations.
                type: object
                properties:
                  name:
                    description: Release name. Defaults to atlas-operator.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  values:
                    description: Helm values merged with the stack's chart defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              snapshotClass:
                description: |
                  VolumeSnapshotClass used by PSQLBranch as its forking target. The
                  stack composes exactly one VolumeSnapshotClass named after the XR
                  (default: "psql"). On EKS Auto Mode the default driver
                  (ebs.csi.aws.com) is correct out of the box; override `driver` for
                  other CSI providers (e.g. driver.longhorn.io, hostpath.csi.k8s.io).
                  PSQLClusters target whatever StorageClass the cluster already
                  provides (Auto Mode ships gp3 by default) — the stack does not
                  compose a StorageClass.
                type: object
                properties:
                  enabled:
                    description: Compose the VolumeSnapshotClass. Defaults to true.
                    type: boolean
                    default: true
                  name:
                    description: VolumeSnapshotClass name. Defaults to "psql" — PSQLBranch references this name.
                    type: string
                    default: psql
                  driver:
                    description: CSI driver. Defaults to ebs.csi.aws.com (EKS Auto Mode default).
                    type: string
                    default: ebs.csi.aws.com
                  deletionPolicy:
                    description: Snapshot deletion policy. Defaults to Delete.
                    type: string
                    enum:
                    - Delete
                    - Retain
                    default: Delete
                  parameters:
                    description: Driver-specific parameters passed to the VolumeSnapshotClass.
                    type: object
                    additionalProperties:
                      type: string
                    x-kubernetes-preserve-unknown-fields: true
            required:
            - clusterName
          status:
            description: PSQLStackStatus defines the observed state.
            type: object
            properties:
              ready:
                description: Overall readiness — true once CNPG, Atlas, the scale-to-zero plugin, and the VolumeSnapshotClass are all Ready.
                type: boolean
        required:
        - spec
