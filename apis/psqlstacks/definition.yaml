apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: psqlstacks.hops.ops.com.ai
spec:
  group: hops.ops.com.ai
  names:
    kind: PSQLStack
    plural: psqlstacks
  scope: Namespaced
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: PSQLStack deploys the StackGres operator (with Citus support) and Atlas Operator for PostgreSQL database management and schema migrations.
        type: object
        properties:
          spec:
            description: PSQLStackSpec defines the desired state.
            type: object
            properties:
              clusterName:
                description: Name of the target cluster. Used as default for helmProviderConfigRef.name and resource naming.
                type: string
              managementPolicies:
                description: Management policies for all composed resources. Defaults to ["*"].
                type: array
                items:
                  type: string
                default:
                - "*"
              labels:
                description: Custom labels applied to all managed resources.
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              helmProviderConfigRef:
                description: Reference to the Helm ProviderConfig. Defaults to clusterName.
                type: object
                properties:
                  name:
                    description: Name of the Helm ProviderConfig.
                    type: string
                  kind:
                    description: Kind of the ProviderConfig. Defaults to ProviderConfig.
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              kubernetesProviderConfigRef:
                description: Reference to the Kubernetes ProviderConfig (used to create the Karpenter NodePool Object). Defaults to clusterName.
                type: object
                properties:
                  name:
                    description: Name of the Kubernetes ProviderConfig.
                    type: string
                  kind:
                    description: Kind of the ProviderConfig. Defaults to ProviderConfig.
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              namespace:
                description: Shared namespace for all components. Defaults to stackgres. Per-component namespace overrides this.
                type: string
              storageClass:
                description: "StorageClass for PostgreSQL workloads. Default provisioner is the EKS Auto Mode EBS CSI driver. Disable with create=false if the cluster already provides a suitable StorageClass."
                type: object
                properties:
                  create:
                    type: boolean
                    default: true
                  name:
                    description: StorageClass name. Defaults to "psql" (mirrors per-stack naming used by the observe stack — loki/prometheus/tempo).
                    type: string
                  provisioner:
                    description: CSI provisioner. Defaults to ebs.csi.eks.amazonaws.com (EKS Auto Mode).
                    type: string
                  parameters:
                    description: Provisioner parameters. Defaults to gp3 + ext4.
                    type: object
                    additionalProperties:
                      type: string
                    x-kubernetes-preserve-unknown-fields: true
                  reclaimPolicy:
                    type: string
                    enum: [Delete, Retain]
                    default: Delete
                  volumeBindingMode:
                    type: string
                    enum: [Immediate, WaitForFirstConsumer]
                    default: WaitForFirstConsumer
                  allowVolumeExpansion:
                    type: boolean
                    default: true
              externalSecrets:
                description: External Secrets Operator integration. Pulls a password from AWS Secrets Manager (via hops secrets) and assembles it with non-secret connection config into a Kubernetes Secret containing a ready-to-use Postgres connection URL. Requires a ClusterSecretStore on the target cluster (e.g. from SecretStack).
                type: object
                properties:
                  enabled:
                    type: boolean
                    default: false
                  clusterSecretStoreName:
                    description: Name of the ClusterSecretStore to read from. Defaults to "hops-aws-secrets-manager".
                    type: string
                  refreshInterval:
                    description: How often ESO should re-pull the secret. Defaults to 1h.
                    type: string
                  connections:
                    description: "List of Postgres connection secrets to compose. The user publishes just the password via `hops secrets sync aws`; the stack combines it with host/port/database/ns to emit a K8s Secret with url + discrete fields."
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          description: Target Kubernetes Secret name. Also used as the logical connection identifier.
                          type: string
                        namespace:
                          description: Target namespace. Defaults to the stack namespace.
                          type: string
                        passwordPath:
                          description: "AWS Secrets Manager secret name containing the password (what `hops secrets sync aws` writes)."
                          type: string
                        passwordKey:
                          description: JSON key inside the AWS Secrets Manager secret holding the password. Defaults to "password".
                          type: string
                        host:
                          description: "Postgres host (e.g. test-pg.stackgres.svc.cluster.local)."
                          type: string
                        port:
                          description: Postgres port. Defaults to 5432.
                          type: integer
                        username:
                          description: Postgres username. Defaults to "postgres".
                          type: string
                        database:
                          description: Postgres database name to connect to.
                          type: string
                        sslmode:
                          description: sslmode query parameter. Defaults to "disable".
                          type: string
                      required: [name, passwordPath, host, database]
              nodePool:
                description: Optional dedicated Karpenter NodePool for PostgreSQL workloads. When enabled, StackGres operator and Atlas schedule here via nodeSelector + tolerations.
                type: object
                properties:
                  enabled:
                    type: boolean
                    default: false
                  nodeClassName:
                    description: EKS NodeClass to reference. Defaults to "default".
                    type: string
                  limits:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                  requirements:
                    description: Karpenter scheduling requirements. Defaults to arm64 spot on r7g/m7g (memory-optimized, general-purpose).
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        operator:
                          type: string
                          enum: [In, NotIn, Exists, DoesNotExist, Gt, Lt]
                        values:
                          type: array
                          items:
                            type: string
                      required: [key, operator]
                  disruption:
                    type: object
                    properties:
                      consolidationPolicy:
                        type: string
                        enum: [WhenEmpty, WhenEmptyOrUnderutilized]
                        default: WhenEmptyOrUnderutilized
                      consolidateAfter:
                        type: string
                        default: "60s"
              stackgresOperator:
                description: Configuration for the StackGres operator component.
                type: object
                properties:
                  name:
                    description: Release name. Defaults to stackgres-operator.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  values:
                    description: Helm values merged with chart defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              atlasOperator:
                description: Configuration for the Atlas Operator component (database schema migrations).
                type: object
                properties:
                  name:
                    description: Release name. Defaults to atlas-operator.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  values:
                    description: Helm values merged with chart defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
            required:
            - clusterName
          status:
            description: PSQLStackStatus defines the observed state.
            type: object
            properties:
              ready:
                description: Overall readiness of the PostgreSQL stack.
                type: boolean
        required:
        - spec
