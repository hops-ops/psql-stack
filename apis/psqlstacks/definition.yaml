apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: psqlstacks.hops.ops.com.ai
spec:
  group: hops.ops.com.ai
  names:
    kind: PSQLStack
    plural: psqlstacks
  scope: Namespaced
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: PSQLStack deploys CloudNativePG, the cnpg-i-scale-to-zero plugin, and the Atlas Operator. It's the platform layer — per-app serving clusters live in PSQLCluster; ephemeral forks live in PSQLBranch.
        type: object
        properties:
          spec:
            description: PSQLStackSpec defines the desired state.
            type: object
            properties:
              clusterName:
                description: Name of the target cluster. Used as default for helmProviderConfigRef.name and resource naming.
                type: string
              managementPolicies:
                description: Management policies for all composed resources. Defaults to ["*"].
                type: array
                items:
                  type: string
                default:
                - "*"
              labels:
                description: Custom labels applied to all managed resources.
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              helmProviderConfigRef:
                description: Reference to the Helm ProviderConfig. Defaults to clusterName.
                type: object
                properties:
                  name:
                    description: Name of the Helm ProviderConfig.
                    type: string
                  kind:
                    description: Kind of the ProviderConfig. Defaults to ProviderConfig.
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              kubernetesProviderConfigRef:
                description: Reference to the Kubernetes ProviderConfig (used to create the Karpenter NodePool Object and to apply the scale-to-zero plugin manifest). Defaults to clusterName.
                type: object
                properties:
                  name:
                    description: Name of the Kubernetes ProviderConfig.
                    type: string
                  kind:
                    description: Kind of the ProviderConfig. Defaults to ProviderConfig.
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              namespace:
                description: Shared namespace for CNPG operator, scale-to-zero plugin, and Atlas operator. Defaults to cnpg-system. Per-component namespace overrides this.
                type: string
              storageClass:
                description: "StorageClass for PostgreSQL workloads. Default provisioner is the EKS Auto Mode EBS CSI driver. Disable with create=false if the cluster already provides a suitable StorageClass. (Phase 2 of the CNPG pivot will replace this with a three-profile storage block.)"
                type: object
                properties:
                  create:
                    type: boolean
                    default: true
                  name:
                    description: StorageClass name. Defaults to "psql".
                    type: string
                  provisioner:
                    description: CSI provisioner. Defaults to ebs.csi.eks.amazonaws.com (EKS Auto Mode).
                    type: string
                  parameters:
                    description: Provisioner parameters. Defaults to gp3 + ext4.
                    type: object
                    additionalProperties:
                      type: string
                    x-kubernetes-preserve-unknown-fields: true
                  reclaimPolicy:
                    type: string
                    enum: [Delete, Retain]
                    default: Delete
                  volumeBindingMode:
                    type: string
                    enum: [Immediate, WaitForFirstConsumer]
                    default: WaitForFirstConsumer
                  allowVolumeExpansion:
                    type: boolean
                    default: true
              nodePool:
                description: Optional dedicated Karpenter NodePool for PostgreSQL workloads. When enabled, CNPG, the scale-to-zero plugin, and Atlas schedule here via nodeSelector + tolerations. (Phase 3 of the CNPG pivot will split this into branches / primary sub-pools with hugepages + nvme-tcp pre-configured.)
                type: object
                properties:
                  enabled:
                    type: boolean
                    default: false
                  nodeClassName:
                    description: EKS NodeClass to reference. Defaults to "default".
                    type: string
                  limits:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                  requirements:
                    description: Karpenter scheduling requirements. Defaults to arm64 spot on r7g/m7g (memory-optimized + general-purpose Graviton).
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        operator:
                          type: string
                          enum: [In, NotIn, Exists, DoesNotExist, Gt, Lt]
                        values:
                          type: array
                          items:
                            type: string
                      required: [key, operator]
                  disruption:
                    type: object
                    properties:
                      consolidationPolicy:
                        type: string
                        enum: [WhenEmpty, WhenEmptyOrUnderutilized]
                        default: WhenEmptyOrUnderutilized
                      consolidateAfter:
                        type: string
                        default: "60s"
              cnpg:
                description: Configuration for the CloudNativePG operator Helm release.
                type: object
                properties:
                  name:
                    description: Helm release name. Defaults to cloudnative-pg.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  chartVersion:
                    description: CNPG Helm chart version. Defaults to 0.27.1 (tracks CNPG 1.29.x).
                    type: string
                  values:
                    description: Helm values merged with chart defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              scaleToZeroPlugin:
                description: "Configuration for the cnpg-i-scale-to-zero plugin (github.com/xataio/cnpg-i-scale-to-zero). Installed via upstream release manifest. Zero cost when no PSQLCluster opts into scale-to-zero."
                type: object
                properties:
                  enabled:
                    description: Default true — the plugin is zero-cost when unused and per-cluster opt-in is cheap.
                    type: boolean
                    default: true
                  version:
                    description: Plugin release tag. The manifest URL pins to this. Defaults to v0.1.7.
                    type: string
                  namespace:
                    description: Namespace override for the plugin install. Defaults to cnpg-system (plugin manifest creates the namespace if missing).
                    type: string
              atlasOperator:
                description: Configuration for the Atlas Operator component (declarative database schema migrations).
                type: object
                properties:
                  name:
                    description: Release name. Defaults to atlas-operator.
                    type: string
                  namespace:
                    description: Namespace override for this component.
                    type: string
                  values:
                    description: Helm values merged with chart defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults for this component.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
            required:
            - clusterName
          status:
            description: PSQLStackStatus defines the observed state.
            type: object
            properties:
              ready:
                description: Overall readiness of the stack (CNPG + scale-to-zero plugin + Atlas).
                type: boolean
        required:
        - spec
