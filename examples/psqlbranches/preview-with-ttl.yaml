# Preview-PR posture — aggressive S2Z + 7-day TTL recorded for external
# cleanup tooling (Kyverno cleanupPolicies, ArgoCD sync windows, etc.).
#
apiVersion: hops.ops.com.ai/v1alpha1
kind: PSQLBranch
metadata:
  name: pr-142
  namespace: preview-pr-142
spec:
  clusterName: production-cluster
  labels:
    pr: "142"
    team: payments
  source:
    name: orders
    namespace: payments
    storage:
      size: 100Gi                # must be at least the source PVC size
  postgresql:
    version: "17"                # must match the source major version
  app:
    role: orders_app
    database: orders
  superuser:
    enabled: true                # branch-local secret for preview migrations
  scaleToZero:
    enabled: true
    idleTimeout: 5m              # very aggressive — preview envs hibernate quickly
  ttl:
    enabled: true
    after: 168h                  # 7d
