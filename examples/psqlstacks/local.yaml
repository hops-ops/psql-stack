# Local: NodePool / Mayastor disabled — gets just CNPG + Atlas + S2Z plugin
# installed on whatever StorageClass already exists on the local cluster.
#
# Useful for kind / k3d dev clusters that can't run Mayastor.
# PSQLClusters on this stack will need to specify a non-Mayastor SC
# (`spec.storage.class: standard` for k3d, etc.).
#
apiVersion: hops.ops.com.ai/v1alpha1
kind: PSQLStack
metadata:
  name: psql
  namespace: default
spec:
  clusterName: local
  helmProviderConfigRef:
    name: default
  nodePool:
    enabled: false
