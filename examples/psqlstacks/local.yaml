# Local: single-node CoW with LVM, no Mayastor (replication needs >1 node),
# no dedicated NodePool. Useful for kind / k3d dev clusters where you want
# fast branching via LVM thin clones but don't need replicated storage.
#
# Requires LVM tools + a `psql-vg` volume group on the local node before
# psql-lvm PVCs can bind.
#
apiVersion: hops.ops.com.ai/v1alpha1
kind: PSQLStack
metadata:
  name: psql
  namespace: default
spec:
  clusterName: local
  helmProviderConfigRef:
    name: default
  storage:
    lvm:
      enabled: true
      volumeGroup: psql-vg
    ebs:
      enabled: false
    mayastor:
      enabled: false
