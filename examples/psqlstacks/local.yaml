# Local: dev cluster without a CSI snapshot controller.
#
# Disables the VolumeSnapshotClass composition (PSQLBranch won't work but
# PSQLCluster still does), and points at a local Helm/Kubernetes
# ProviderConfig instead of the per-cluster ProviderConfig pattern.
#
apiVersion: hops.ops.com.ai/v1alpha1
kind: PSQLStack
metadata:
  name: psql
  namespace: default
spec:
  clusterName: local
  helmProviderConfigRef:
    name: default
  kubernetesProviderConfigRef:
    name: default
  snapshotClass:
    enabled: false
  scaleToZeroPlugin:
    enabled: false
