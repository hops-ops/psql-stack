# Minimal: defaults across the board.
#
# Composes:
#   - CloudNativePG operator (Helm)
#   - cnpg-i-scale-to-zero plugin (set of Objects, requires cert-manager)
#   - Atlas operator (Helm)
#   - VolumeSnapshotClass `psql` (driver: ebs.csi.eks.amazonaws.com)
#
# PSQLClusters target the cluster's existing default StorageClass
# (gp3 on EKS Auto Mode, standard on kind/k3d, etc.). PSQLBranch
# references the `psql` VolumeSnapshotClass for forking primaries.
#
apiVersion: hops.ops.com.ai/v1alpha1
kind: PSQLStack
metadata:
  name: psql
  namespace: default
spec:
  clusterName: my-cluster
