# Minimal: defaults across the board.
#
# Composes:
#   - CloudNativePG operator (Helm)
#   - cnpg-i-scale-to-zero plugin (set of Objects)
#   - Atlas operator (Helm)
#   - Karpenter NodePool sub-pools: branches (spot) + primary (spot)
#   - Longhorn V2 (Helm) on the primary sub-pool nodes
#   - psql StorageClass + VolumeSnapshotClass (Longhorn-backed, replicated, CoW)
#   - node-prep DaemonSet (hugepages + nvme_tcp / vfio_pci / uio_pci_generic
#     / ublk_drv on each NVMe node, plus Longhorn disk auto-registration)
#
# This is the stack's whole point: CoW Postgres on dedicated NVMe nodes.
# To opt out of NVMe / Longhorn entirely (and just get CNPG + Atlas + S2Z
# on the cluster's existing default StorageClass), set nodePool.enabled: false
# and have your PSQLClusters target a different SC.
#
apiVersion: hops.ops.com.ai/v1alpha1
kind: PSQLStack
metadata:
  name: psql
  namespace: default
spec:
  clusterName: my-cluster
