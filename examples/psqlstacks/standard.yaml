apiVersion: hops.ops.com.ai/v1alpha1
kind: PSQLStack
metadata:
  name: psql
  namespace: default
spec:
  clusterName: production-cluster
  namespace: stackgres
  labels:
    team: platform
  nodePool:
    enabled: true
  storageClass:
    create: true
    name: psql
  externalSecrets:
    enabled: true
    connections:
    - name: psql-production
      namespace: stackgres
      passwordPath: psql/production
      host: test-pg.stackgres.svc.cluster.local
      database: postgres
  stackgresOperator:
    values:
      deploy:
        restapi: true
  atlasOperator:
    values:
      prewarmDevDB: true
