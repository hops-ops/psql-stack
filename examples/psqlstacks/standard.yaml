# Standard: production posture with HA + atlas tuning + team labels.
#
apiVersion: hops.ops.com.ai/v1alpha1
kind: PSQLStack
metadata:
  name: psql
  namespace: default
spec:
  clusterName: production-cluster
  namespace: cnpg-system
  labels:
    team: platform
  ha:
    enabled: true                # 3 replicas + topology spread by zone on
    replicas: 3                  # all platform components (CNPG, Atlas,
    topologySpreadByZone: true   # S2Z plugin Deployment).
  scaleToZeroPlugin:
    enabled: true
  atlasOperator:
    values:
      prewarmDevDB: true
