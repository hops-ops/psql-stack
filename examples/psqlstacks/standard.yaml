# Standard: production posture with explicit overrides for sizing,
# scheduling, and chart values.
#
apiVersion: hops.ops.com.ai/v1alpha1
kind: PSQLStack
metadata:
  name: psql
  namespace: default
spec:
  clusterName: production-cluster
  namespace: cnpg-system
  labels:
    team: platform
  nodePool:
    enabled: true
    branches:
      enabled: true
      limits: { cpu: "32", memory: "128Gi" }
    primary:
      enabled: true
      limits: { cpu: "64", memory: "256Gi" }
  storage:
    replicationFactor: 3
    thin: true
  scaleToZeroPlugin:
    enabled: true
  atlasOperator:
    values:
      prewarmDevDB: true
