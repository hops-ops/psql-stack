apiVersion: hops.ops.com.ai/v1alpha1
kind: PSQLStack
metadata:
  name: psql
  namespace: default
spec:
  clusterName: production-cluster
  namespace: cnpg-system
  labels:
    team: platform
  nodePool:
    enabled: true
  storage:
    ebs:
      enabled: true
      storageClassName: psql-ebs
  cnpg:
    values: {}
  atlasOperator:
    values:
      prewarmDevDB: true
