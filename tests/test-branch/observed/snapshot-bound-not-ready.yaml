apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: pr-142-source-cluster
  namespace: default
  annotations:
    crossplane.io/composition-resource-name: source-cluster
    gotemplating.fn.crossplane.io/composition-resource-name: source-cluster
status:
  conditions:
    - type: Ready
      status: "True"
  atProvider:
    manifest:
      spec:
        imageName: ghcr.io/cloudnative-pg/postgresql:17
      status:
        phase: Cluster in healthy state
---
apiVersion: kubernetes.m.crossplane.io/v1alpha1
kind: Object
metadata:
  name: pr-142-branch-snapshot
  namespace: default
  annotations:
    crossplane.io/composition-resource-name: branch-snapshot
    gotemplating.fn.crossplane.io/composition-resource-name: branch-snapshot
status:
  conditions:
    - type: Ready
      status: "False"
  atProvider:
    manifest:
      status:
        boundVolumeSnapshotContentName: snapcontent-bound-not-ready
        readyToUse: false
